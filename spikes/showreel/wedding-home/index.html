<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>The Wedding Home</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/bricolage.woff2") format("woff2"); font-weight: 800; font-display: block; }
    @font-face { font-family: Kalam; src: url("assets/fonts/kalam-deva.woff2") format("woff2"); font-weight: 700; font-display: block; unicode-range: U+0900-097F; }
    @font-face { font-family: Caveat; src: url("assets/fonts/caveat.woff2") format("woff2"); font-weight: 700; font-display: block; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1A1020; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1A1020; color: #F7EDE2; font-family: "Bricolage Grotesque", sans-serif; }
    .clip { position: absolute; inset: 0; }
    .wash { position: absolute; width: 900px; height: 900px; border-radius: 50%; left: -200px; top: -160px; background: radial-gradient(circle, rgba(226,59,106,.35), transparent 68%); }
    .title { position: absolute; left: 90px; top: 560px; margin: 0; width: 880px; font-size: 92px; line-height: .9; font-weight: 800; letter-spacing: -0.05em; }
    .gold { color: #E4B15A; }
    .hindi { position: absolute; left: 100px; top: 860px; margin: 0; font-family: Kalam, sans-serif; font-size: 72px; color: #E4B15A; }
    .chip { position: absolute; height: 120px; border-radius: 28px; display: flex; align-items: center; padding: 0 28px; font-size: 40px; font-weight: 800; }
    .c1 { left: 90px; top: 480px; background: #E23B6A; width: 280px; }
    .c2 { left: 400px; top: 480px; background: #E4B15A; color: #1A1020; width: 300px; }
    .c3 { left: 90px; top: 640px; background: #F7EDE2; color: #1A1020; width: 250px; }
    .c4 { left: 370px; top: 640px; background: #7C3A58; width: 340px; }
    .board { position: absolute; left: 120px; top: 860px; width: 820px; border-radius: 32px; background: #2A1828; padding: 28px; }
    .row { height: 84px; display: flex; align-items: center; justify-content: space-between; font-size: 36px; font-weight: 800; border-bottom: 2px solid rgba(247,237,226,.1); }
    .phone { position: absolute; left: 310px; top: 420px; width: 460px; height: 820px; border-radius: 46px; background: #F7EDE2; color: #1A1020; }
    .plink { position: absolute; left: 48px; top: 280px; right: 48px; font-size: 42px; font-weight: 800; line-height: 1.05; }
    .end { position: absolute; left: 90px; top: 680px; margin: 0; font-size: 92px; font-weight: 800; letter-spacing: -0.04em; line-height: .95; }
    .hand { position: absolute; left: 100px; top: 980px; margin: 0; font-family: Caveat, cursive; font-size: 70px; color: #E4B15A; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
    <div class="wash" id="wash"></div>
    <section id="s1" class="clip" data-start="0" data-duration="3.6" data-track-index="1">
      <h1 id="t1" class="title">The Wedding <span class="gold">Home</span></h1>
      <p id="h1" class="hindi">एक घर</p>
    </section>
    <section id="s2" class="clip" data-start="3.6" data-duration="4.4" data-track-index="1">
      <div id="c1" class="chip c1">RSVP</div>
      <div id="c2" class="chip c2">Events</div>
      <div id="c3" class="chip c3">Tasks</div>
      <div id="c4" class="chip c4">Gallery</div>
      <div id="board" class="board">
        <div class="row" id="r1"><span>Mehendi</span><span class="gold">Fri</span></div>
        <div class="row" id="r2"><span>Baraat</span><span class="gold">Sat</span></div>
        <div class="row" id="r3"><span>Wedding</span><span class="gold">Sun</span></div>
      </div>
    </section>
    <section id="s3" class="clip" data-start="8" data-duration="4" data-track-index="1">
      <div id="phone" class="phone">
        <p id="plink" class="plink">No account. Just the link.</p>
      </div>
    </section>
    <section id="s4" class="clip" data-start="12" data-duration="4" data-track-index="1">
      <h1 id="end" class="end">One list. The whole family.</h1>
      <p id="hand" class="hand">guests never sign up</p>
    </section>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#wash", { scale: 0.9 }, { scale: 1.1, duration: 16, ease: "none" }, 0);
    tl.fromTo("#t1", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, 0.25);
    tl.fromTo("#h1", { y: 16, opacity: 0, rotation: -6 }, { y: 0, opacity: 1, rotation: -3, duration: 0.4, ease: "power3.out", immediateRender: false }, 1.1);
    ["#c1", "#c2", "#c3", "#c4"].forEach((id, i) => {
      tl.fromTo(id, { y: 24, scale: 0.8, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.6)", immediateRender: false }, 3.8 + i * 0.16);
    });
    tl.fromTo("#board", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, 4.7);
    ["#r1", "#r2", "#r3"].forEach((id, i) => {
      tl.fromTo(id, { x: 20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.28, ease: "power3.out", immediateRender: false }, 5.1 + i * 0.18);
    });
    tl.fromTo("#phone", { y: 80, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 8.2);
    tl.fromTo("#plink", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 8.8);
    tl.fromTo("#end", { scale: 1.15, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power4.out", immediateRender: false }, 12.25);
    tl.fromTo("#hand", { y: 12, opacity: 0, rotation: -5 }, { y: 0, opacity: 1, rotation: -2, duration: 0.4, ease: "power3.out", immediateRender: false }, 12.9);
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
