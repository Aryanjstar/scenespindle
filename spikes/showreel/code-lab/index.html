<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Code Lab</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/bricolage.woff2") format("woff2"); font-weight: 800; font-display: block; }
    @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/mono.woff2") format("woff2"); font-weight: 500; font-display: block; }
    @font-face { font-family: Caveat; src: url("assets/fonts/caveat.woff2") format("woff2"); font-weight: 700; font-display: block; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0B1020; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0B1020; color: #E8F7FF; font-family: "Bricolage Grotesque", sans-serif; }
    .clip { position: absolute; inset: 0; }
    .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(61,227,245,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(61,227,245,.08) 1px, transparent 1px); background-size: 80px 80px; }
    .kicker { position: absolute; left: 100px; top: 280px; margin: 0; font-family: "JetBrains Mono", monospace; font-size: 28px; color: #3DE3F5; letter-spacing: 0.08em; }
    .title { position: absolute; left: 100px; top: 340px; margin: 0; font-size: 84px; font-weight: 800; letter-spacing: -0.04em; }
    .code { position: absolute; left: 100px; top: 500px; width: 860px; border-radius: 24px; background: #121A33; padding: 28px 32px; font-family: "JetBrains Mono", monospace; font-size: 32px; line-height: 1.45; }
    .code p { margin: 0; }
    .cells { position: absolute; left: 90px; top: 980px; display: flex; gap: 14px; }
    .cell { width: 130px; height: 130px; border-radius: 22px; background: #16213F; display: grid; place-items: center; font-size: 40px; font-weight: 800; }
    .ptr { position: absolute; font-family: "JetBrains Mono", monospace; font-size: 26px; }
    #lo { top: 1136px; } #mid { top: 1188px; } #hi { top: 1240px; }
    .lo { color: #B8F35B; } .hi { color: #FF5FA2; } .mid { color: #3DE3F5; }
    .verdict { position: absolute; left: 100px; top: 1320px; margin: 0; font-size: 64px; font-weight: 800; }
    .slam { position: absolute; left: 90px; top: 700px; margin: 0; font-size: 150px; font-weight: 800; letter-spacing: -0.05em; line-height: .9; }
    .note { position: absolute; left: 100px; top: 1100px; margin: 0; font-family: Caveat, cursive; font-size: 72px; color: #B8F35B; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
    <div class="grid"></div>
    <section id="s1" class="clip" data-start="0" data-duration="11.2" data-track-index="1">
      <p id="kicker" class="kicker">CODE LAB</p>
      <h1 id="title" class="title">Find 21</h1>
      <div id="code" class="code">
        <p id="c1">lo, hi = 0, n - 1</p>
        <p id="c2">mid = (lo + hi) // 2</p>
        <p id="c3">if arr[mid] == target</p>
      </div>
      <div class="cells" id="cells">
        <div class="cell" id="n0">4</div>
        <div class="cell" id="n1">9</div>
        <div class="cell" id="n2">15</div>
        <div class="cell" id="n3">21</div>
        <div class="cell" id="n4">28</div>
        <div class="cell" id="n5">33</div>
      </div>
      <div id="lo" class="ptr lo" style="left:110px">lo</div>
      <div id="hi" class="ptr hi" style="left:860px">hi</div>
      <div id="mid" class="ptr mid" style="left:400px">mid</div>
      <p id="verdict" class="verdict">too low</p>
    </section>
    <section id="s2" class="clip" data-start="11.2" data-duration="4.8" data-track-index="1">
      <h1 id="found" class="slam">3 checks.</h1>
      <p id="note" class="note">not a guess. a trace.</p>
    </section>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const cells = ["#n0", "#n1", "#n2", "#n3", "#n4", "#n5"];
    tl.fromTo("#kicker", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 0.2);
    tl.fromTo("#title", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, 0.35);
    tl.fromTo("#code", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, 0.6);
    cells.forEach((id, i) => {
      tl.fromTo(id, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power3.out", immediateRender: false }, 1.05 + i * 0.08);
    });
    tl.fromTo("#lo", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 1.8);
    tl.fromTo("#hi", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 1.9);
    tl.fromTo("#mid", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, 2.3);
    tl.to("#mid", { x: -40, duration: 0.35, ease: "power2.inOut" }, 2.5);
    tl.to("#n2", { backgroundColor: "#3DE3F5", color: "#0B1020", duration: 0.2 }, 2.9);
    tl.fromTo("#verdict", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, immediateRender: false }, 3.1);
    tl.to("#n0, #n1, #n2", { opacity: 0.2, duration: 0.3 }, 4.2);
    tl.to("#lo", { x: 430, duration: 0.35, ease: "power2.inOut" }, 4.3);
    tl.to("#verdict", { opacity: 0, duration: 0.15 }, 4.6);
    tl.to("#mid", { x: 250, duration: 0.35, ease: "power2.inOut" }, 5.0);
    tl.to("#n4", { backgroundColor: "#FF5FA2", color: "#0B1020", duration: 0.2 }, 5.4);
    tl.set("#verdict", { textContent: "too high" }, 5.5);
    tl.fromTo("#verdict", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 5.55);
    tl.to("#n4, #n5", { opacity: 0.2, duration: 0.3 }, 6.5);
    tl.to("#hi", { x: -280, duration: 0.35, ease: "power2.inOut" }, 6.5);
    tl.to("#verdict", { opacity: 0, duration: 0.15 }, 6.9);
    tl.to("#mid", { x: 110, duration: 0.4, ease: "power3.out" }, 7.2);
    tl.to("#n3", { backgroundColor: "#B8F35B", color: "#0B1020", scale: 1.12, duration: 0.35, ease: "back.out(1.6)" }, 7.7);
    tl.set("#verdict", { textContent: "found" }, 8.1);
    tl.fromTo("#verdict", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 8.15);
    tl.to("#c3", { color: "#B8F35B", duration: 0.2 }, 8.4);

    tl.fromTo("#found", { scale: 1.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power4.out", immediateRender: false }, 11.45);
    tl.fromTo("#note", { y: 16, opacity: 0, rotation: -4 }, { y: 0, opacity: 1, rotation: -2, duration: 0.4, ease: "power3.out", immediateRender: false }, 12.2);
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
