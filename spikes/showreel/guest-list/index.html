<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Guest list</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/bricolage.woff2") format("woff2"); font-weight: 800; font-display: block; }
    @font-face { font-family: Kalam; src: url("assets/fonts/kalam-deva.woff2") format("woff2"); font-weight: 700; font-display: block; unicode-range: U+0900-097F; }
    @font-face { font-family: Caveat; src: url("assets/fonts/caveat.woff2") format("woff2"); font-weight: 700; font-display: block; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1A1024; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1A1024; color: #F7EDE2; font-family: "Bricolage Grotesque", sans-serif; }
    .clip { position: absolute; inset: 0; }
    .kicker { position: absolute; left: 100px; top: 280px; margin: 0; font-family: Kalam, sans-serif; font-size: 64px; color: #E4B15A; }
    .names { position: absolute; left: 120px; top: 460px; width: 760px; }
    .name { height: 92px; display: flex; align-items: center; font-size: 48px; font-weight: 800; border-bottom: 2px solid rgba(247,237,226,.12); }
    .bar { position: absolute; left: 100px; width: 8px; height: 92px; border-radius: 8px; background: #E23B6A; }
    .slam { position: absolute; left: 90px; top: 640px; margin: 0; font-size: 200px; line-height: .85; font-weight: 800; letter-spacing: -0.06em; }
    .sub { position: absolute; left: 100px; top: 980px; margin: 0; font-size: 56px; font-weight: 800; }
    .hand { position: absolute; left: 100px; top: 1120px; margin: 0; font-family: Caveat, cursive; font-size: 78px; color: #E4B15A; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920">
    <section id="s1" class="clip" data-start="0" data-duration="10.2" data-track-index="1">
      <p id="kicker" class="kicker">अतिथि सूची</p>
      <div class="names" id="names">
        <div class="name" id="a">Aisha</div>
        <div class="name" id="b">Dev</div>
        <div class="name" id="c">Farah</div>
        <div class="name" id="d">Kabir</div>
        <div class="name" id="e">Meera</div>
        <div class="name" id="f">Neel</div>
        <div class="name" id="g">Riya</div>
        <div class="name" id="h">Zoya</div>
      </div>
      <div id="bar" class="bar" style="top:460px"></div>
    </section>
    <section id="s2" class="clip" data-start="10.2" data-duration="4.8" data-track-index="1">
      <h1 id="half" class="slam">Half.</h1>
      <p id="sub" class="sub">Half. Found.</p>
      <p id="hand" class="hand">14 checks, not 10,000</p>
    </section>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const rows = ["#a", "#b", "#c", "#d", "#e", "#f", "#g", "#h"];
    tl.fromTo("#kicker", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, 0.2);
    rows.forEach((id, i) => {
      tl.fromTo(id, { x: 24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, 0.45 + i * 0.06);
    });
    tl.fromTo("#bar", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, 1.3);
    tl.to("#bar", { y: 276, duration: 0.35, ease: "power3.inOut" }, 1.7);
    tl.to("#e, #f, #g, #h", { x: 180, opacity: 0, duration: 0.35, ease: "power3.in" }, 2.4);
    tl.to("#bar", { y: 92, duration: 0.3, ease: "power2.inOut" }, 3.1);
    tl.to("#a, #b", { x: -180, opacity: 0, duration: 0.3, ease: "power3.in" }, 3.6);
    tl.to("#bar", { y: 184, duration: 0.28, ease: "power2.inOut" }, 4.2);
    tl.to("#d", { scale: 1.08, color: "#E4B15A", duration: 0.25, ease: "power3.out" }, 4.7);
    tl.to("#c", { opacity: 0.25, duration: 0.25 }, 4.7);
    tl.fromTo("#half", { scale: 1.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power4.out", immediateRender: false }, 10.4);
    tl.fromTo("#sub", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 11.1);
    tl.fromTo("#hand", { y: 14, opacity: 0, rotation: -5 }, { y: 0, opacity: 1, rotation: -2, duration: 0.4, ease: "power3.out", immediateRender: false }, 11.7);
    window.__timelines["main"] = tl;
  </script>
</body>
</html>
